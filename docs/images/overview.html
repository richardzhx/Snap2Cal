 </style><body><main><div class="brand"><span class="icon">↗</span>Snap2Cal<span class="tag">截图入历 · iPhone 实际使用界面</span></div><h1>从识别到入历，<br><em>每一步都由你确认。</em></h1><p class="lead">勾选事项 → 编辑确认 → 存入日历</p><aside class="cost">接入 DeepSeek API<br>单次约 <strong>0.5 分钱</strong><br><span style="font-size:14px">日常使用费用参考，实际按用量计费</span></aside><section><figure><div class="step"><span>01</span><h2>勾选要添加的事项</h2></div><p>一张截图，多条事项分别选择</p><div class="device"><img src="select-events.png" alt="勾选要添加的事项"></div></figure><figure><div class="step"><span>02</span><h2>修改标题、时间和提醒</h2></div><p>保存前，在原生日历表单里确认</p><div class="device"><img src="edit-event.png" alt="修改标题、时间和提醒"></div></figure><figure><div class="step"><span>03</span><h2>在日历里查看结果</h2></div><p>名称、时间、地点和原文一起保留</p><div class="device"><img src="saved-event.png" alt="在日历里查看结果"></div></figure></section><footer>真机截图 · 演示事项为虚构测试数据 · 保留原始界面与文字<br>截图中为自定义的「提前 2 小时」提醒；v1.4.0 默认提前 1 小时，可自行修改。</footer></main></body></html>
